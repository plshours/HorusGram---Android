name: HorusGram Android Debug Build

on:
  push:
    branches:
      - main
      # A feature branch builds as soon as it is pushed, without a pull
      # request or a manual run.
      - feature/**
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: Architectures to build, separated by commas
        type: choice
        options:
          - arm64-v8a
          - arm64-v8a,armeabi-v7a
          - armeabi-v7a,arm64-v8a,x86,x86_64
        default: arm64-v8a
        required: true

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HorusGram (debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # The native code is compiled for every architecture listed here, with
      # link-time optimisation, so each one adds about an hour on a standard
      # runner. Phones of the last years are all arm64-v8a.
      HORUS_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"

    steps:
      - name: Free disk space
        run: |
          # The sources with their submodules and the native build need more
          # room than the runner leaves free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Configure Telegram API credentials
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # Telegram asks every client to use its own api_id and api_hash from
          # https://my.telegram.org. Without the secrets the build falls back
          # to the public development values from Telegram Desktop's build
          # documentation, as HorusGram Desktop does: fine for testing, not
          # for an APK handed to other people.
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH are not set, using the public development values."
            API_ID=2040
            API_HASH=b18441a1ff607e10a989891a5462e627
          fi
          echo "apiId=$API_ID" >> local.properties
          echo "apiHash=$API_HASH" >> local.properties

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Push notifications through Firebase need a google-services.json of
          # your own Firebase project, base64-encoded in this secret. Without
          # it a placeholder lets the build run; the app then gets messages
          # while it is open or kept in the background by its own service.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          else
            cp Tools/horusgram/google-services.placeholder.json TMessagesProj_App/google-services.json
          fi

      - name: Build HorusGram
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleDebug -PhorusAbis="$HORUS_ABIS" --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          # Compiler errors, then Gradle's own explanation, then every cause of
          # the stack trace: the root cause is usually the last of those, and
          # the logs themselves can only be read when signed in.
          found=$(
            grep -E '(^e: |: error:|^ERROR:)' "$log" | head -30
            sed -n '/^\* What went wrong:/,/^\* Try:/p' "$log" | grep -v '^\* Try:' | head -40
            grep -E '^Caused by: ' "$log" | sed 's/^Caused by: //' | awk '!seen[$0]++' | head -20
          )
          if [ -z "$found" ]; then
            found=$(tail -40 "$log")
          fi
          {
            echo '## Build errors'
            echo '```'
            echo "$found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub shows ten annotations per step, so the whole report goes into one.
          message=$(printf '%s' "$found" | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::$message"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: HorusGram-Android-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HorusGram-Android-debug
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
